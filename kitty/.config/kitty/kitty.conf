# ---------------------------------------------------------
# FONT CONFIGURATION
# ---------------------------------------------------------
font_family      JetBrains Mono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.5

# Slight line height padding for clean glyph rendering
adjust_line_height  110%

# ---------------------------------------------------------
# WINDOW & PADDING
# ---------------------------------------------------------
window_padding_width 14
hide_window_decorations yes
confirm_os_window_close 0

# Subtle blur and transparency (requires a compositor like Picom or Hyprland)
background_opacity 0.92
dynamic_background_opacity yes

# ---------------------------------------------------------
# CURSOR & MOUSE
# ---------------------------------------------------------
# Soft lunar gold cursor
cursor                  #f6d365
cursor_text_color       #0c101c
cursor_shape            beam
cursor_beam_thickness   1.8
cursor_blink_interval   0.6

# URL underline & styling
url_color               #ecc94b
url_style               curly
detect_urls             yes

# Selection (starlight highlight)
selection_foreground    #0a0e17
selection_background    #ffd166

# ---------------------------------------------------------
# COLOR PALETTE (Lunar Midnight & Pale Gold)
# ---------------------------------------------------------
# Deep nocturnal blue background & pale moonlit foreground
background              #0a0e17
foreground              #d8e2fd

# Black / Deep Abyss
color0                  #151b28
color8                  #2a354b

# Red / Eclipsed Crimson
color1                  #e06c75
color9                  #ea838b

# Green / Lunar Aurora
color2                  #73daca
color10                 #8decdb

# Yellow / Radiant Gold (The primary motif)
color3                  #ecc94b
color11                 #f6e05e

# Blue / Deep Celestial Sapphire
color4                  #5a88e5
color12                 #7aa2f7

# Magenta / Nebula Violet
color5                  #b48ead
color13                 #c69fc1

# Cyan / Pale Starlight Cyan
color6                  #7dcfff
color14                 #a4e5ff

# White / Moon Surface White
color7                  #c0caf5
color15                 #e2ebfe

# ---------------------------------------------------------
# TABS (If using Kitty tab bar)
# ---------------------------------------------------------
tab_bar_style           powerline
tab_powerline_style     slanted
active_tab_foreground   #0a0e17
active_tab_background   #ecc94b
inactive_tab_foreground #7a889b
inactive_tab_background #131a29
